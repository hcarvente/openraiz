<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic document metadata -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse jobs, fellowships, internships, and volunteer roles from organizations that welcome, prefer, or require lived experience." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <meta property="og:title" content="OpenRaíz — Opportunities" />
  <meta property="og:description" content="Browse jobs, fellowships, internships, and volunteer roles from organizations that welcome, prefer, or require lived experience." />
  <meta property="og:image" content="assets/og-image.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>OpenRaíz — Opportunities</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Site header: centered logo lockup (sprout mark + wordmark) with a centered pill nav below it, shared across all pages -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <!-- Sprout mark: stem + leaves above ground, roots reaching below — ties to "Raíz" (root) -->
      <svg class="logo-mark" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="14" x2="20" y2="14"></line>
        <path d="M12 14V5"></path>
        <path d="M12 8C10 8 8 6.5 7.5 5"></path>
        <path d="M12 8C14 8 16 6.5 16.5 5"></path>
        <path d="M12 14C12 14 9 16 8 20"></path>
        <path d="M12 14V20"></path>
        <path d="M12 14C12 14 15 16 16 20"></path>
      </svg>
      OpenRaíz
    </a>
    <!-- About (index.html) is now the landing page, so "Opportunities" points to this file, not index.html -->
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">About</a>
      <a href="opportunities.html" class="is-active" aria-current="page">Opportunities</a>
      <a href="archive.html">Archive</a>
    </nav>
    <!-- Small gradient accent underline beneath the nav -->
    <div class="header-accent" aria-hidden="true"></div>
  </header>

  <main>
    <!-- Hero: mission statement, centered to match the header above, always visible above the listings -->
    <section class="hero">
      <h1>Opportunities rooted in lived experience.</h1>
      <p>Jobs, fellowships, internships, and volunteer roles from organizations that value what you bring.</p>
    </section>

    <!-- Filter controls: each has a real <label> for accessibility; js/filter.js reads these values on every change -->
    <section class="filters" aria-label="Filter opportunities">
      <div class="filter-field filter-field-search">
        <label for="filter-keyword">Search</label>
        <input type="search" id="filter-keyword" placeholder="Search opportunities…" />
      </div>
      <div class="filter-field">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="all">All types</option>
          <option value="job">Job</option>
          <option value="fellowship">Fellowship</option>
          <option value="internship">Internship</option>
          <option value="volunteer">Volunteer</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-location">Location</label>
        <!-- Option labels match the location badge wording on each card (values stay remote/hybrid/onsite to match the data) -->
        <select id="filter-location">
          <option value="all">All locations</option>
          <option value="remote">Virtual</option>
          <option value="hybrid">Hybrid</option>
          <option value="onsite">In-person</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-paid">Pay</label>
        <select id="filter-paid">
          <option value="all">Paid &amp; unpaid</option>
          <option value="paid">Paid</option>
          <option value="unpaid">Unpaid</option>
        </select>
      </div>
      <!-- aria-live announces the result count to screen readers whenever a filter changes it -->
      <p class="filter-result-count" aria-live="polite"></p>
    </section>

    <!-- Opportunity cards are generated dynamically from data/opportunities.json, filtered by js/filter.js -->
    <section class="opportunity-grid" aria-label="Open opportunities">
      <!-- Opportunity cards render here -->
    </section>
  </main>

  <!-- Site footer: brand/attribution line, shared across all pages -->
  <footer class="site-footer">
    <p>OpenRaíz — Incubated by Alianza for Opportunity</p>
  </footer>

  <!-- Scripts load in dependency order: data.js and render.js define
       functions archive.js and filter.js use, and main.js kicks everything off -->
  <script src="js/data.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/archive.js" defer></script>
  <script src="js/filter.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
